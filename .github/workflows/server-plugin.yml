name: Server plugin API

on:
  push:
    paths:
      - "server-plugin/**"
      - ".github/workflows/server-plugin.yml"
  pull_request:
    paths:
      - "server-plugin/**"
      - ".github/workflows/server-plugin.yml"

permissions:
  contents: read

concurrency:
  group: server-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify server plugin and client evidence API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server-plugin
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server-plugin/pom.xml

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Run PMD
        run: mvn -B -ntp org.apache.maven.plugins:maven-pmd-plugin:3.26.0:check

      - name: Verify public API packaging
        run: |
          jar tf target/EnthusiaServerAutoClicker.jar > target/jar-entries.txt
          grep -Fx 'net/enthusia/autoclicker/server/api/ClientHandshakeSnapshot.class' target/jar-entries.txt
          grep -Fx 'net/enthusia/autoclicker/server/api/EnthusiaAutoClickerClientApi.class' target/jar-entries.txt
          if grep -Eq '^(org/junit|org/bukkit)/' target/jar-entries.txt; then
            echo '::error::Test or provided Paper classes leaked into the plugin JAR.'
            exit 1
          fi

      - name: Upload verified server plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EnthusiaServerAutoClicker
          path: server-plugin/target/EnthusiaServerAutoClicker.jar
          if-no-files-found: error
          retention-days: 7
